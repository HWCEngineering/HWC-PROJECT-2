name: CI - Development

# Runs on pushes to dev and PRs targeting dev
# Purpose: Validate code quality, build integrity, and catch issues early
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  lint-and-build-frontend:
    runs-on: ubuntu-latest
    name: Lint & Build Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync assets
        run: npm run assets:sync

      - name: Sync Potree
        run: npm run potree:sync

      # Build frontend with a placeholder API URL (not deploying, just validating build)
      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: "https://placeholder.azurecontainerapps.io"
          PUBLIC_MAPTILER_API_KEY: "placeholder"
          PUBLIC_APP_BASE_PATH: "/cloud-viewer"
        run: npm run build

  validate-backend:
    runs-on: ubuntu-latest
    name: Validate Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          # Install test dependencies
          pip install pytest pytest-asyncio httpx

      # Validate Python syntax and imports (without needing GDAL/system deps)
      - name: Syntax check
        working-directory: apps/api
        run: python -m py_compile main.py

      # Build Docker image to validate Dockerfile
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: hwc-potree-api:ci-test
