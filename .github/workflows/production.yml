name: Production - Build & Deploy

# Triggers on push to main.
# Builds backend image, pushes to GHCR, deploys to Azure Container Apps,
# then builds frontend with the discovered API URL and deploys to Azure Static Web Apps.
#
# KEY DESIGN: The frontend build happens AFTER backend deployment so the API URL
# is auto-discovered via Azure CLI — no manual PUBLIC_API_BASE_URL updates needed.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'hwc-potree-api' }}
  CONTAINER_ENV_NAME: ${{ vars.AZURE_CONTAINER_ENV_NAME || 'LiDAR-CONTAINER' }}

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build backend Docker image and push to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GitHub Container Registry using built-in token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy backend to Azure Container Apps and retrieve the FQDN
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Azure
    needs: build-backend
    runs-on: ubuntu-latest
    outputs:
      # This output is consumed by the frontend job to set PUBLIC_API_BASE_URL
      api-url: ${{ steps.get-url.outputs.api_url }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy or update Container App
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          # Check if container app exists
          if az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            >/dev/null 2>&1; then

            echo "Container App exists — updating image and env vars..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.AZURE_MONGO_NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.AZURE_MONGO_NAME }}" \
                NAME="${{ vars.AZURE_MONGO_NAME }}"
          else
            echo "Container App does not exist — creating..."
            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV_NAME }} \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 2.0 \
              --memory 4.0Gi \
              --registry-server ${{ env.REGISTRY }} \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GITHUB_TOKEN }} \
              --env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.AZURE_MONGO_NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.AZURE_MONGO_NAME }}" \
                NAME="${{ vars.AZURE_MONGO_NAME }}"
          fi

      # Retrieve the backend FQDN dynamically so the frontend can use it
      - name: Get backend API URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          API_URL="https://${FQDN}"
          echo "Discovered API URL: $API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      # Verify the backend is healthy before proceeding to frontend deploy
      - name: Verify backend health
        run: |
          API_URL="${{ steps.get-url.outputs.api_url }}"
          echo "Checking health at: ${API_URL}/health"

          # Retry up to 5 times with 15s delay (container may be starting)
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 15
          done

          echo "WARNING: Backend health check did not return 200, proceeding anyway"
          # Don't fail — the container may still be starting up

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build frontend with discovered API URL and deploy to Static Web Apps
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Azure Static Web Apps
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync assets
        run: npm run assets:sync

      - name: Sync Potree files
        run: npm run potree:sync

      # Build frontend using the API URL discovered from the backend deployment
      # This eliminates the need to manually set PUBLIC_API_BASE_URL
      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: ${{ needs.deploy-backend.outputs.api-url }}
          PUBLIC_MAPTILER_API_KEY: ${{ vars.PUBLIC_MAPTILER_API_KEY }}
          PUBLIC_APP_BASE_PATH: /cloud-viewer
        run: |
          echo "Building frontend with API URL: $PUBLIC_API_BASE_URL"
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          output_location: "dist"
          skip_app_build: true  # Already built above with correct env vars
